<div class="admin-shell">
  <!-- Backdrop behind the mobile drawer. Persistent in the DOM (fades via the
       .open class); non-interactive and hidden ≥lg via global CSS. -->
  <div class="shell-backdrop" [class.open]="drawerOpen()" (click)="closeDrawer()" aria-hidden="true"></div>

  <aside class="shell-sidebar" [class.shell-sidebar-open]="drawerOpen()">
    <!-- Brand lives once, in the global top bar (app.component). The sidebar
         opens straight into the workspace nav. -->
    <p class="shell-section-label mono-label">
      {{ 'shell.workspace' | translate }}
    </p>

    <nav class="shell-nav">
      @for (item of navItems; track item.id) {
        <a
          class="shell-nav-item"
          [routerLink]="item.link"
          [class.shell-nav-active]="isActive(item.id)"
          [attr.data-nav]="item.id"
          (click)="closeDrawer()"
        >
          <span class="shell-nav-tick" aria-hidden="true"></span>
          <span class="shell-nav-label">{{ item.labelKey | translate }}</span>
        </a>
      }
    </nav>

    <div class="shell-footer">
      <span class="shell-org mono-label">{{ orgName() }}</span>
    </div>
  </aside>

  <div class="shell-main">
    <header class="shell-topbar">
      <div class="shell-topbar-titles">
        <button
          #hamburger
          type="button"
          class="shell-hamburger"
          (click)="toggleDrawer()"
          [attr.aria-expanded]="drawerOpen()"
          [attr.aria-label]="'shell.toggleNav' | translate"
        >
          <span aria-hidden="true">☰</span>
        </button>
        <h1 class="shell-page-title">
          <ng-content select="[shell-title]">{{ title() }}</ng-content>
        </h1>
        @if (breadcrumb()) {
          <span class="shell-breadcrumb">{{ breadcrumb() }}</span>
        }
      </div>

      <!-- Overflow trigger — hidden ≥lg; below lg it reveals the actions group
           as a popover so the projected actions are never clipped off-screen. -->
      <button
        type="button"
        class="shell-actions-toggle"
        (click)="toggleActions()"
        aria-haspopup="true"
        [attr.aria-expanded]="actionsOpen()"
        [attr.aria-label]="'shell.moreActions' | translate"
      >
        <span aria-hidden="true">⋯</span>
      </button>

      <div class="shell-topbar-actions">
        <input
          class="shell-search"
          type="search"
          [placeholder]="'shell.search' | translate"
          [value]="searchValue()"
          (input)="onSearch($event)"
        />
        <div class="shell-actions-group" [class.open]="actionsOpen()">
          <ng-content select="[shell-actions]"></ng-content>
          @if (newLabel() !== null) {
            <button type="button" class="shell-new-btn" (click)="newClicked.emit()">
              + {{ newLabel() || ('shell.new' | translate) }}
            </button>
          }
        </div>
      </div>
    </header>

    <main class="shell-content">
      <ng-content></ng-content>
    </main>
  </div>
</div>
